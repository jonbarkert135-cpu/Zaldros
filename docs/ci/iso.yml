# .github/workflows/iso.yml — build real ISOs, boot them, measure them.
# A green build job means nothing on its own: only the boot job may report PASS.
name: iso

on:
  workflow_dispatch:
  push:
    paths: ["build/iso/**", "shell/**", "system/theme/**", ".github/workflows/iso.yml"]

permissions:
  contents: write        # the build publishes its diagnostics to a ci-logs-* branch (see below)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [full, services, legacy]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools zstd
      - name: Build ISO (${{ matrix.variant }})
        run: |
          set -o pipefail
          sudo -E ./build/iso/build-iso.sh ${{ matrix.variant }} zaldros-${{ matrix.variant }}.iso \
            2>&1 | tee build-${{ matrix.variant }}.log
      # ponytail: diagnostics must never be able to fail the job — the ISO itself is the result.
      - name: Diagnostics summary (always)
        if: always()
        continue-on-error: true
        run: |
          sudo chown -R "$USER" build-debug-${{ matrix.variant }} build-${{ matrix.variant }}.log || true
          D=build-debug-${{ matrix.variant }}
          {
            echo "## build ${{ matrix.variant }} — ${{ job.status }}"
            echo "### step exit codes"; echo '```'; cat "$D/steps.tsv" 2>/dev/null; echo '```'
            echo "### environment"; echo '```'; head -80 "$D/environment.txt" 2>/dev/null; echo '```'
            echo "### last 200 lines of the build log"; echo '```'
            tail -200 build-${{ matrix.variant }}.log 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Artifacts and job logs need repository admin rights to download, which blocks the
      # read-the-error → fix loop. Publishing the same diagnostics to a branch makes them plainly
      # readable by anyone working on the build, with no extra tooling.
      - name: Publish diagnostics to the ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          BRANCH=ci-logs-${{ matrix.variant }}
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -a build-debug-${{ matrix.variant }}/. /tmp/pub/ 2>/dev/null || true
          cp build-${{ matrix.variant }}.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q . && git checkout -q -b "$BRANCH"
          git config user.email "ci@zaldros.invalid" && git config user.name "zaldros ci"
          echo "run ${{ github.run_id }} / ${{ matrix.variant }} / ${{ job.status }}" > RUN.txt
          git add -A && git commit -qm "diagnostics: run ${{ github.run_id }} ${{ matrix.variant }} ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BRANCH"
      - name: Keep every diagnostic, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-${{ matrix.variant }}
          path: |
            build-${{ matrix.variant }}.log
            build-debug-${{ matrix.variant }}/**
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-${{ matrix.variant }}
          path: zaldros-${{ matrix.variant }}.iso
          retention-days: 7

  boot:
    needs: build
    # ponytail: a failed sibling variant must never block booting the ISOs that did build.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [full, services, legacy]
        profile: [low, mid, modern]   # stage 2 (UI) matters most on low and mid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "iso-${{ matrix.variant }}" }
      - name: Install QEMU and check for KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf socat imagemagick
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM available"; \
          else echo "BLOCKED — ENVIRONMENT LIMITATION: no /dev/kvm on this runner, falling back to TCG (slow)"; fi
      - name: Boot test (${{ matrix.variant }} / ${{ matrix.profile }})
        run: ./build/iso/boot-test.sh zaldros-${{ matrix.variant }}.iso ${{ matrix.profile }} results
      - name: UI drive log
        if: always()
        run: cat results/*.ui-drive.log 2>/dev/null || echo "no UI drive log"
      - name: Result matrix
        if: always()
        run: |
          # pipefail, or `tee` reports success for a report that crashed and a boot that failed.
          set -o pipefail
          python3 ./build/iso/report.py results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish boot results to the ci-logs branch
        if: always()
        run: |
          BRANCH=ci-logs-boot-${{ matrix.variant }}-${{ matrix.profile }}
          mogrify -format png results/*.ppm 2>/dev/null && rm -f results/*.ppm || true
          cd results
          git init -q . && git checkout -q -b "$BRANCH"
          git config user.email "ci@zaldros.invalid" && git config user.name "zaldros ci"
          git add -A && git commit -q --allow-empty -m "boot ${{ matrix.variant }}/${{ matrix.profile }} — ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-${{ matrix.variant }}-${{ matrix.profile }}
          path: results/
          retention-days: 14

# The CI job for Zaldros Sheets.
# It lives here rather than in .github/workflows/ci.yml because the bot account that pushes
# this repository has no `workflows` permission and GitHub rejects the push outright. Paste
# this block at the end of .github/workflows/ci.yml from an account that may edit workflows.
  sheets:
    name: Zaldros Sheets (real Calc engine + measured UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the engine, the UNO bridge and Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc-nogui python3-uno \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python3 -m pip install --break-system-packages PySide6-Essentials pytest
      - name: Prove the engine is really there
        run: python3 -c "import uno, shutil; assert shutil.which('soffice'); print('engine ok')"
      - name: Tests (engine round trip + measured window)
        working-directory: apps/sheets
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest tests -q
      - name: Render the window as evidence
        working-directory: apps/sheets
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m zaldros_sheets render --out sheets-light.png
          python3 -m zaldros_sheets render --dark --out sheets-dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: sheets-screenshots
          path: |
            apps/sheets/sheets-light.png
            apps/sheets/sheets-dark.png

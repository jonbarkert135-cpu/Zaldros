name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  office:
    name: office (${{ matrix.app }}, real UNO + Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {app: writer, component: writer}
          - {app: sheets, component: calc}
          - {app: slides, component: impress}
    steps:
      - uses: actions/checkout@v4
      - name: Install the matching system Python and Office engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-uno python3-venv libreoffice-${{ matrix.component }}-nogui \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-liberation fonts-dejavu-core
          /usr/bin/python3 tools/dev/setup.py office --venv .venv-office
      - name: Record interpreter and engine versions
        run: |
          mkdir -p office-results
          {
            printf 'workflow_sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            git rev-parse HEAD
            .venv-office/bin/python --version
            soffice --version
            dpkg-query -W python3-uno libreoffice-core-nogui libreoffice-${{ matrix.component }}-nogui
            .venv-office/bin/python -m pip freeze
          } > office-results/versions.txt
          cat office-results/versions.txt
      - name: Test real engine round trips and Qt UI without skips
        env:
          QT_QPA_PLATFORM: offscreen
          ZALDROS_OFFICE_EVIDENCE_DIR: ${{ github.workspace }}/office-results
        run: .venv-office/bin/python tools/ci/office.py ${{ matrix.app }} --junitxml office-results/tests.xml
      - name: Preserve Office test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-${{ matrix.app }}
          path: office-results/
          if-no-files-found: error

  sysprobe:
    name: zaldros-sysprobe (unit tests + live run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare the tools environment
        run: |
          python tools/dev/setup.py tools
          echo "$GITHUB_WORKSPACE/.venv-tools/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: python -m pytest tools -q
      - name: Live probe on the runner (real systemd system)
        working-directory: tools/zaldros-sysprobe
        run: python -m zaldros_sysprobe -o service-map.md && head -30 service-map.md
      - uses: actions/upload-artifact@v4
        with:
          name: service-map
          path: tools/zaldros-sysprobe/service-map.md
      - name: Live hardware inventory on the runner
        working-directory: tools/zaldros-hwinfo
        run: python -m zaldros_hwinfo -o inventory.md && head -25 inventory.md
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-inventory
          path: tools/zaldros-hwinfo/inventory.md

  compat:
    name: compatibility registries (evidence gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No compatibility claim without evidence (spec PART 4 §25)
        working-directory: tools/zaldros-compat
        run: python -m zaldros_compat --check

  image:
    name: build OS images (requires podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zaldros-base
        run: podman build -t zaldros-base -f build/Containerfile.base .
      - name: Build zaldros-desktop
        run: podman build -t zaldros-desktop -f build/Containerfile.desktop .

  bench:
    name: benchmark harness (baseline on the runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect a baseline sample (real systemd host)
        working-directory: tools/zaldros-bench
        run: |
          python -m zaldros_bench collect \
            --label ci-runner --commit "${GITHUB_SHA::7}" -o baseline.json
          cat baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: tools/zaldros-bench/baseline.json

  shell:
    name: shell prototype (backend + visual render tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-noto-color-emoji dbus-daemon gnupg curl tar
          python tools/dev/setup.py shell --venv .venv-shell
          echo "$GITHUB_WORKSPACE/.venv-shell/bin" >> "$GITHUB_PATH"
      - name: Run shell tests and render evidence screenshots
        working-directory: shell/zaldros-shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -q
          python -m zaldros_shell render --out desktop.png
          python -m zaldros_shell render --start --out start.png
          python -m zaldros_shell render --quick --out quick.png
          python -m zaldros_shell render --context --out context.png
          python -m zaldros_shell render --light --out light.png
      - uses: actions/upload-artifact@v4
        with:
          name: shell-screenshots
          path: |
            shell/zaldros-shell/desktop.png
            shell/zaldros-shell/start.png
            shell/zaldros-shell/quick.png
            shell/zaldros-shell/context.png
            shell/zaldros-shell/light.png

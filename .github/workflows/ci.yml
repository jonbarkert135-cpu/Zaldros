name: CI

on:
  push:
  pull_request:

jobs:
  sysprobe:
    name: zaldros-sysprobe (unit tests + live run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Unit tests
        run: python -m pytest tools -q
      - name: Live probe on the runner (real systemd system)
        working-directory: tools/zaldros-sysprobe
        run: python -m zaldros_sysprobe -o service-map.md && head -30 service-map.md
      - uses: actions/upload-artifact@v4
        with:
          name: service-map
          path: tools/zaldros-sysprobe/service-map.md
      - name: Live hardware inventory on the runner
        working-directory: tools/zaldros-hwinfo
        run: python -m zaldros_hwinfo -o inventory.md && head -25 inventory.md
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-inventory
          path: tools/zaldros-hwinfo/inventory.md

  compat:
    name: compatibility registries (evidence gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No compatibility claim without evidence (spec PART 4 §25)
        working-directory: tools/zaldros-compat
        run: python -m zaldros_compat --check

  image:
    name: build OS images (requires podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zaldros-base
        run: podman build -t zaldros-base -f build/Containerfile.base .
      - name: Build zaldros-desktop
        run: podman build -t zaldros-desktop -f build/Containerfile.desktop .

  bench:
    name: benchmark harness (baseline on the runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect a baseline sample (real systemd host)
        working-directory: tools/zaldros-bench
        run: |
          python -m zaldros_bench collect \
            --label ci-runner --commit "${GITHUB_SHA::7}" -o baseline.json
          cat baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: tools/zaldros-bench/baseline.json

  shell:
    name: shell prototype (backend + visual render tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 fonts-noto-color-emoji
          python -m pip install PySide6-Essentials pytest
      - name: Run shell tests and render evidence screenshots
        working-directory: shell/zaldros-shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -q
          python -m zaldros_shell render --out desktop.png
          python -m zaldros_shell render --start --out start.png
          python -m zaldros_shell render --quick --out quick.png
          python -m zaldros_shell render --context --out context.png
          python -m zaldros_shell render --light --out light.png
      - uses: actions/upload-artifact@v4
        with:
          name: shell-screenshots
          path: |
            shell/zaldros-shell/desktop.png
            shell/zaldros-shell/start.png
            shell/zaldros-shell/quick.png
            shell/zaldros-shell/context.png
            shell/zaldros-shell/light.png
